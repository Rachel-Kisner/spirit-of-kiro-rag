description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rachel Kisner", email = "rachel8508773@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "gradio>=6.31.0",
    "llama-index>=0.14.25",
    "llama-index-core>=0.14.25",
    "llama-index-embeddings-cohere>=0.9.0",
    "llama-index-llms-cohere>=0.10.0",
